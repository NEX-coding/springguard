<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SpringGuard · Spring 审查增强</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #0f172a; --muted: #64748b; --line: #dbe3ee; --bg: #eef3f8;
      --card: #fff; --accent: #b42318; --ok: #067647; --warn: #b54708;
      --shadow: 0 12px 36px rgba(15,23,42,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(800px 400px at 10% -10%, rgba(180,35,24,.12), transparent 50%),
                  linear-gradient(180deg, #f8fafc, var(--bg));
      min-height: 100vh;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }
    .brand { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
    h1 { margin: 6px 0 8px; font-size: 28px; letter-spacing: -.03em; }
    .lead { color: var(--muted); margin: 0 0 22px; max-width: 40rem; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 16px;
    }
    h2 { margin: 0 0 10px; font-size: 16px; }
    .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      border: 1px solid var(--line); background: #fff; border-radius: 10px;
      padding: 9px 12px; font: 600 13px "IBM Plex Sans", system-ui; cursor: pointer;
    }
    .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chip {
      display: inline-block; font: 500 11px/1 "IBM Plex Mono", monospace;
      padding: 4px 8px; border-radius: 999px; background: #f1f5f9; border: 1px solid var(--line);
      margin: 0 6px 6px 0;
    }
    .list { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
    .item { padding: 12px; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    .sev { font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .sev.critical, .sev.high { color: var(--accent); }
    .sev.medium { color: var(--warn); }
    .meta { font: 12px/1.45 "IBM Plex Mono", monospace; color: var(--muted); margin-top: 4px; }
    .msg { margin-top: 6px; font-size: 14px; }
    .status { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .status.err { color: var(--accent); }
    .status.ok { color: var(--ok); }
    pre {
      margin: 0; background: #0f172a; color: #e2e8f0; border-radius: 12px;
      padding: 12px; font: 12px/1.5 "IBM Plex Mono", monospace; overflow: auto; max-height: 280px;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">SpringGuard</div>
    <h1>Spring 智能审查增强</h1>
    <p class="lead">自研确定性规则 + 阿里开源 Open Code Review。先加载 <code>out/merged.json</code> 或仅 Guard 结果进行演示。</p>

    <div class="grid">
      <section class="card">
        <h2>缺陷列表</h2>
        <p class="sub">运行 <code>python3 scripts/run_pipeline.py --skip-ocr</code> 后刷新</p>
        <div class="row">
          <button class="primary" id="btn-load" type="button">加载 out/merged.json</button>
          <button id="btn-guard" type="button">加载 spring_guard.json</button>
        </div>
        <div id="summary"></div>
        <div class="list" id="list"></div>
        <div class="status" id="status">尚未加载结果</div>
      </section>
      <section class="card">
        <h2>评测摘要</h2>
        <p class="sub">来自 <code>eval/results.json</code></p>
        <pre id="eval">点击下方加载</pre>
        <div class="row" style="margin-top:12px">
          <button id="btn-eval" type="button">加载评测结果</button>
        </div>
      </section>
    </div>
  </div>
<script>
async function loadJson(url) {
  const r = await fetch(url + "?t=" + Date.now());
  if (!r.ok) throw new Error(url + " 不存在，请先跑流水线生成 out/");
  return r.json();
}

function renderFindings(data) {
  const findings = data.findings || data || [];
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");
  const by = {};
  findings.forEach(f => { by[f.severity || "info"] = (by[f.severity || "info"] || 0) + 1; });
  summary.innerHTML = Object.entries(by).map(([k,v]) => `<span class="chip">${k}: ${v}</span>`).join("")
    + `<span class="chip">total: ${findings.length}</span>`;
  list.innerHTML = findings.map(f => `
    <div class="item">
      <div><span class="sev ${f.severity || ""}">${f.severity || "-"}</span>
        · <strong>${f.rule || f.source || ""}</strong></div>
      <div class="msg">${f.message || ""}</div>
      <div class="meta">${f.file || ""}:${f.line || 0} · ${f.source || ""}</div>
      <div class="meta">${(f.evidence || "").slice(0,160)}</div>
    </div>
  `).join("") || `<div class="item">无发现</div>`;
}

document.getElementById("btn-load").onclick = async () => {
  const st = document.getElementById("status");
  try {
    const d = await loadJson("../out/merged.json");
    renderFindings(d);
    st.className = "status ok";
    st.textContent = `已加载 merged · Guard ${d.spring_guard?.count ?? "-"} · OCR ${d.ocr?.findings ?? 0}`;
  } catch (e) {
    st.className = "status err";
    st.textContent = String(e.message || e);
  }
};

document.getElementById("btn-guard").onclick = async () => {
  const st = document.getElementById("status");
  try {
    const d = await loadJson("../out/spring_guard.json");
    renderFindings(d);
    st.className = "status ok";
    st.textContent = `已加载 Guard · ${d.summary?.count ?? d.findings?.length ?? 0} 条`;
  } catch (e) {
    st.className = "status err";
    st.textContent = String(e.message || e);
  }
};

document.getElementById("btn-eval").onclick = async () => {
  const el = document.getElementById("eval");
  try {
    const d = await loadJson("../eval/results.json");
    el.textContent = JSON.stringify(d, null, 2);
  } catch (e) {
    el.textContent = String(e.message || e);
  }
};

// 进入页面自动尝试加载，减少演示点击
(async () => {
  try {
    const d = await loadJson("../out/merged.json");
    renderFindings(d);
    document.getElementById("status").className = "status ok";
    document.getElementById("status").textContent =
      `已自动加载 merged · Guard ${d.spring_guard?.count ?? "-"} · OCR ${d.ocr?.findings ?? 0}`;
  } catch (_) {
    try {
      const d = await loadJson("../out/spring_guard.json");
      renderFindings(d);
      document.getElementById("status").className = "status ok";
      document.getElementById("status").textContent = "已自动加载 spring_guard.json";
    } catch (e2) {
      document.getElementById("status").className = "status err";
      document.getElementById("status").textContent = "请先运行 scripts/demo.sh 或 run_pipeline.py";
    }
  }
  try {
    const d = await loadJson("../eval/results.json");
    document.getElementById("eval").textContent = JSON.stringify(d, null, 2);
  } catch (_) {}
})();
</script>
</body>
</html>
